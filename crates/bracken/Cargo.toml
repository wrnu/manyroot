[package]
name = "bracken"
description = "Bracken: agent-native collaborative software development on Manyroot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bracken"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
bracken-tree.workspace = true
getrandom.workspace = true
httparse.workspace = true
humantime.workspace = true
manyroot.workspace = true
clap.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs"] }

[dev-dependencies]
tempfile.workspace = true

# The Ground benchmark (task 7a3d17f979c3): `cargo bench -p bracken --bench ground -- --help`.
[[bench]]
name = "ground"
path = "benches/ground/main.rs"
harness = false
