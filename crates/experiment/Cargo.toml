[package]
name = "bracken-experiment"
description = "The Phase 1 experiment: three collaboration modes on one task, measured the same way"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bracken-experiment"
path = "src/main.rs"

[dependencies]
bracken-demo = { path = "../demo" }
# CRDT mode's text CRDT (note 7f9a154018f5). Pinned exactly (decision 89568ebb896f), with
# hexane, its pre-release encoding crate, which this crate doesn't use directly.
automerge = { version = "=0.12.0", default-features = false }
hexane = { version = "=1.0.0-alpha.5", default-features = false }
blake3.workspace = true
clap.workspace = true
hex.workspace = true
rustix = { version = "1.1", features = ["process"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
