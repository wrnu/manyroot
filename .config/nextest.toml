# cargo-nextest's profiles (decision 4bf44934cb67, from note 7c232382f2d1).
#
# Plain `cargo nextest run` and `cargo test` run every test. The `fast` profile, for a builder's run
# (`cargo nextest run -P fast --workspace`, AGENTS.md's Tests), leaves out the slow set: the tests at
# 30 s or over in one measured run of the workspace. The manager's counted run runs every test, these
# included.
#
# Each is named exactly, by its test binary and its name, so a renamed or moved test falls back into
# the fast tier rather than out of every run.
#
# The fast profile also runs 4 tests at a time (task c29555cbb440): builders share one Mac, and under
# that load a run at the default, one test per CPU, failed on load alone. An explicit `-j <n>` or
# `--test-threads <n>` still overrides it. Only this profile is set: the default profile, which
# scripts/test-table, the counted run and CI use, keeps nextest's default. The research workspace has its
# own, research/.config/nextest.toml.

[profile.fast]
test-threads = 4
default-filter = """
not (
    (binary_id(=bracken::scripts) & (
        test(=merge::merge_accepts_main_ahead_in_code_only_where_the_manager_tested_the_merge_in_scripts)
        | test(=merge::merge_accepts_main_ahead_in_code_only_where_the_manager_tested_the_merge_in_the_kickoff_templates)
        | test(=verify_seq::verify_seq_sigterm_with_sigint_ignored_still_stops_both_runs)
        | test(=merge::merge_counts_a_docs_only_or_reused_pass_only_where_it_holds_in_scripts)
        | test(=merge::merge_counts_a_docs_only_or_reused_pass_only_where_it_holds_in_the_kickoff_templates)
        | test(=merge::merge_lets_main_be_ahead_only_in_skill_docs_the_branch_leaves_alone)
        | test(=merge::merge_asks_for_the_research_docker_run_only_where_the_docker_code_changed)
        | test(=ground_checkpoint::ground_checkpoint_refuses_more_than_a_pipe_of_unexpected_staged_lines)
        | test(=ground_guards::ground_guards_refuse_each_way_a_head_can_hide_or_break_the_ground)
    ))
)
"""
