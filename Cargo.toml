[workspace]
resolver = "3"
members = ["crates/manyroot", "crates/bracken", "crates/demo", "crates/experiment", "crates/scope", "crates/tree", "crates/query-lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://forge.jx.rs/Autimo/manyroot"

[workspace.dependencies]
manyroot = { path = "crates/manyroot" }
bracken-tree = { path = "crates/tree" }
anyhow = "1"
blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
httparse = "1"
humantime = "2"
icu_casemap = "2"
# Pinned exactly: the line merge's results are part of what the format guard pins (task 7cbd0a0ce7d0).
imara-diff = { version = "=0.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

# Line tables keep file and line numbers in panics and backtraces but drop the rest of the debug info,
# most of a dev build's size (owner decision 8ac9b0239d90). Tests inherit it.
[profile.dev]
debug = "line-tables-only"

# Dependencies optimized in dev builds and tests: signing and hashing at opt-level 0 made the demo's
# adversary tests 3x slower, and the full test table too slow for a 4-vCPU boat box (task 489bfeb6b5af).
# The workspace's own crates stay unoptimized, for debugging.
[profile.dev.package."*"]
opt-level = 2
