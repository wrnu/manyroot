[workspace]
resolver = "3"
members = ["crates/manyroot", "crates/bracken", "crates/demo", "crates/experiment"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://forge.jx.rs/Autimo/manyroot"

[workspace.dependencies]
manyroot = { path = "crates/manyroot" }
anyhow = "1"
blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
