# Tests, lint, formatting and the Ground guards, run only by hand (workflow_dispatch), on the branch it's
# started from. It deploys nothing. Nothing runs on push or pull_request: this repository is public, so its
# Actions can't be trusted with secrets, and a PR from anyone would run here. Per owner decision
# 20a06f9b815e the manager's counted run of the test table on the exact head (scripts/bk-evidence) is the
# CI, and scripts/merge runs scripts/ground-guards itself. This run is an extra observer: when it disagrees
# with the Ground, the manager records a ci-disagreement claim (owner decision 8b2454e4cf81; process
# section 10).
name: CI

on:
  workflow_dispatch:

# Read-only: the run needs no write access and no secret.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    steps:
      # Plain git, no checkout action and no token: the repository is public.
      - name: Check out
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          # Fetch the ref, then check out the run's own commit: if the branch moved on while the run was
          # queued, fail instead of testing a newer commit and reporting it against this one.
          git fetch -q --depth=100 origin "${{ github.ref }}"
          git checkout -q --detach "${{ github.sha }}" || {
            echo "${{ github.sha }} is no longer on ${{ github.ref }}; a newer run covers the new commit"
            exit 1
          }
          echo "checked out $(git rev-parse HEAD) from ${{ github.ref }}"
          # main, for the append-only check below.
          git fetch -q --depth=100 origin +refs/heads/main:refs/remotes/origin/main
      - name: Toolchain
        run: |
          rustup component add clippy rustfmt
          # scripts/team-server hashes tokens with b3sum; its test runs it.
          cargo install --locked b3sum --version 1.8.7
          cargo --version
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      # The checks on the committed Ground that the test table doesn't make (no keys or stray files under
      # .bracken/, append-only since the merge base with main, the Ground opens, docs/vision.md matches), in
      # the one copy scripts/merge also runs. A run dispatched on main fails this step by design: HEAD is
      # origin/main, so there's no merge base to compare with, and ground-guards fails rather than check nothing.
      - name: Ground guards
        run: |
          cargo build -q --locked -p bracken
          BRACKEN_BIN=target/debug/bracken scripts/ground-guards origin/main HEAD
